apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: night-watch
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: night-watch
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: night-watch
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.workerRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.workerPort }}
          env:
            - name: NIGHT_WATCH_PROPLUS_ROLE
              value: worker
            - name: NightWatch__IpDatasets__AllowOutboundLookup
              value: "false"
            - name: NightWatch__FeatureFlags__ExperimentalMl
              value: Disabled
