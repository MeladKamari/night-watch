apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: night-watch
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: night-watch
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: night-watch
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.apiRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.apiPort }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.env.ASPNETCORE_ENVIRONMENT | quote }}
            - name: NightWatch__IpDatasets__AllowOutboundLookup
              value: {{ .Values.env.NightWatch__IpDatasets__AllowOutboundLookup | quote }}
            - name: NightWatch__FeatureFlags__ExperimentalMl
              value: {{ .Values.env.NightWatch__FeatureFlags__ExperimentalMl | quote }}
            - name: ConnectionStrings__Postgres
              value: "Host={{ .Release.Name }}-postgres;Port=5432;Database={{ .Values.postgres.database }};Username={{ .Values.postgres.user }};Password=$(POSTGRES_PASSWORD)"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKey }}
          readinessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.apiPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app.kubernetes.io/name: night-watch
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: {{ .Values.service.apiPort }}
