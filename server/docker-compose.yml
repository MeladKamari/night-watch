# Night Watch local stack - Self-hosted / air-gap friendly.
# Secrets via env file (never commit production credentials).
name: night-watch

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: nightwatch
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: night_watch
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightwatch -d night_watch"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "10.0"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=night_watch;Username=nightwatch;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      NightWatch__EnvironmentName: Development
      NightWatch__Storage__ConnectionString: "Host=postgres;Port=5432;Database=night_watch;Username=nightwatch;Password=${POSTGRES_PASSWORD}"
      NightWatch__Redis__ConnectionString: "redis:6379"
      NightWatch__Redis__Required: "false"
      NightWatch__IpDatasets__AllowOutboundLookup: "false"
      NightWatch__FeatureFlags__ExperimentalMl: Disabled
      NightWatch__MigrateOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        DOTNET_VERSION: "10.0"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      IBF_PROPLUS_ROLE: worker
      NightWatch__EnvironmentName: Development
      NightWatch__IpDatasets__AllowOutboundLookup: "false"
      NightWatch__FeatureFlags__ExperimentalMl: Disabled
      NightWatch__MigrateOnStartup: "false"
    depends_on:
      api:
        condition: service_started
    ports:
      - "8081:8081"

  gateway:
    image: nginx:1.27.3-alpine
    profiles: ["gateway"]
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8443:443"
      - "8088:80"
    depends_on:
      - api

  # Angular dashboard - placeholder service (app bootstrapped in phase 07)
  dashboard:
    image: nginx:1.27.3-alpine
    profiles: ["dashboard"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "4200:80"

volumes:
  pgdata:
  redisdata:

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password.txt
