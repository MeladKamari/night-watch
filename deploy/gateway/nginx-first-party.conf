# IBF ProPlus first-party gateway (offline-capable). No foreign CDN / analytics.
# Host: identify.local.test  (see hosts.offline.example)

upstream ibf_proplus_api {
    server 127.0.0.1:5080;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=ibf_api:10m rate=30r/s;

server {
    listen 443 ssl http2;
    server_name identify.local.test;

    ssl_certificate     /etc/ibf/pki/identify.local.test.crt;
    ssl_certificate_key /etc/ibf/pki/identify.local.test.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Cache-Control "no-store" always;

    # Trust only this gateway when forwarding client IP (see TrustedProxyCidrs).
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    location = /collect {
        limit_req zone=ibf_api burst=60 nodelay;
        proxy_pass http://ibf_proplus_api/v1/observations;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
        add_header Access-Control-Allow-Origin "https://app.local.test" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    location = /identify {
        limit_req zone=ibf_api burst=60 nodelay;
        proxy_pass http://ibf_proplus_api/v1/identify;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /gateway/metrics {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
