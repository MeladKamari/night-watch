# Publish @thenightwatch frontend packages to npm on push to main.
#
# Auth (preferred): npm Trusted Publishing (OIDC) — no long-lived token.
# For each package on npmjs.com → Package Settings → Trusted Publisher:
#   Provider: GitHub Actions
#   User/org: MeladKamari
#   Repository: night-watch
#   Workflow filename: publish.yml
#   Allow: npm publish
#
# Optional fallback secret: NPM_TOKEN (granular token with Bypass 2FA).
#
# Skip a push: include "chore(release):" or "[skip release]" in the commit message.
name: publish

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/core/**'
      - 'packages/browser-sdk/**'
      - 'packages/vanilla/**'
      - 'packages/react/**'
      - 'packages/preact/**'
      - 'packages/vue/**'
      - 'packages/angular/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/release/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump when local is not already ahead of npm
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CI: true
  NODE_OPTIONS: --no-warnings

jobs:
  publish:
    name: version-build-publish
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Resolve bump type
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Version, build, and publish to npm
        id: release
        env:
          # OIDC is primary; secret is optional fallback.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/ci-publish.mjs --execute --bump="${{ steps.bump.outputs.type }}" | tee /tmp/ci-publish.log
          VERSION="$(grep -E '^NEXT_VERSION=' /tmp/ci-publish.log | tail -n1 | cut -d= -f2)"
          if [ -z "$VERSION" ] && [ -f scripts/release/.last-version ]; then
            VERSION="$(tr -d '[:space:]' < scripts/release/.last-version)"
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not resolve published version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Published version: $VERSION"

      - name: Commit version bump and push tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json \
            packages/browser-sdk/package.json \
            packages/vanilla/package.json \
            packages/react/package.json \
            packages/preact/package.json \
            packages/vue/package.json \
            packages/angular/package.json
          if git diff --cached --quiet; then
            echo "No package.json changes to commit"
          else
            git commit -m "chore(release): v${VERSION}"
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
          else
            git tag "v${VERSION}"
          fi
          git push origin HEAD
          git push origin "v${VERSION}"
