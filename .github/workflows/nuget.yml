# Pack + push NightWatch.Blazor to nuget.org.
#
# Secret required: NUGET_API_KEY
#   https://www.nuget.org/account/apikeys
#   Scopes: Push new packages and package versions
#   Glob: NightWatch.Blazor (or *)
#
# Skip a push: include "chore(release):" or "[skip nuget]" in the commit message.
name: nuget

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/blazor/csharp/**'
      - 'packages/blazor/README.md'
      - 'scripts/release/nuget-publish.mjs'
      - '.github/workflows/nuget.yml'
  workflow_dispatch:

concurrency:
  group: publish-nuget
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: pack-and-push
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip nuget]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9afe14ece07b3366853f49544ae3dbfe # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Pack and push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: node scripts/release/nuget-publish.mjs --execute
