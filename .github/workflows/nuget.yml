# Pack + push NightWatch.Blazor to nuget.org and GitHub Packages via CI.
#
# nuget.org auth (preferred): Trusted Publishing (OIDC) — no long-lived key.
#   1. https://www.nuget.org/account/TrustedPublishing
#      Repository Owner: MeladKamari
#      Repository: night-watch
#      Workflow File: nuget.yml
#   2. GitHub secret NUGET_USER = nuget.org profile username (NOT email)
#
# Optional fallback: GitHub secret NUGET_API_KEY
# GitHub Packages: uses GITHUB_TOKEN (packages: write).
#
# Skip a push: include "chore(release):" or "[skip nuget]" in the commit message.
name: nuget

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/blazor/csharp/**'
      - 'packages/blazor/README.md'
      - 'scripts/release/nuget-publish.mjs'
      - '.github/workflows/nuget.yml'
  workflow_dispatch:

concurrency:
  group: publish-nuget
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: pack-and-push
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip nuget]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Choose NuGet auth mode
        id: auth
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${NUGET_USER:-}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${NUGET_API_KEY:-}" ]; then
            echo "mode=apikey" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set GitHub secret NUGET_USER (Trusted Publishing) or NUGET_API_KEY"
            exit 1
          fi

      - name: NuGet login (OIDC → temp API key)
        id: login
        if: steps.auth.outputs.mode == 'oidc'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Pack and push to nuget.org + GitHub Packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/nuget-publish.mjs --execute --github
